[package]
name = "mrl_index"
version = "0.3.5"
edition = "2021"
description = "Local-first bitplane-transposed vector retrieval engine (mrl-index)"
license = "MIT"
readme = "README.md"
keywords = ["vector-search", "rag", "bitplane", "ann", "retrieval"]
categories = ["database-implementations", "science"]

[lib]
name = "mrl_index"
path = "src/lib.rs"

[[bin]]
name = "mrl-index"
path = "src/bin/mrl_index.rs"

[[bench]]
name = "scan_bench"
harness = false

[dependencies]
anyhow = "1"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
half = { version = "2", features = ["bytemuck"] }
memmap2 = "0.9"
parking_lot = "0.12"
rand = "0.8"
rand_chacha = "0.3"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

[profile.bench]
lto = true
codegen-units = 1
